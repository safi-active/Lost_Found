{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>{{ _("Report a Lost Item") }}</h1>
    <p>{{ _("Please provide the details of the item you lost.") }}</p>
</div>

<div class="card" style="max-width: 600px;">
    <form method="POST">
        <div class="form-group">
            <label>{{ _("Item Name *") }}</label>
            <input type="text" name="item_name" required>
        </div>
        <div class="form-group">
            <label>{{ _("Color *") }}</label>
            <input type="text" name="color" required>
        </div>
        <div class="form-group">
            <label>{{ _("Date Lost *") }}</label>
            <input type="date" name="date_lost" required>
        </div>
        <div class="form-group">
            <label>{{ _("Last Known Location (Optional)") }}</label>
            <input type="text" name="location">
        </div>
        <div class="form-group">
            <label>{{ _("Additional Description (Optional)") }}</label>
            <textarea name="description" rows="3"></textarea>
        </div>
        <button type="submit" class="btn">{{ _("Submit Claim") }}</button>
    </form>
</div>
{% endblock %}
