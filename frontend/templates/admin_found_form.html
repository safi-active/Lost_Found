{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>Register Recovered Item</h2>
    <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Log an item handed over to security.</p>
    <form method="POST" enctype="multipart/form-data">
        <label>Item Name (Required)</label>
        <input type="text" name="item_name" required>
        
        <label>Color (Required)</label>
        <input type="text" name="color" required>

        <label>Date Received (Required)</label>
        <input type="date" name="date_received" required>

        <label>Location Found (Optional)</label>
        <input type="text" name="location_found">

        <label>Description (Optional)</label>
        <textarea name="description" rows="2"></textarea>

        <label>Handed Over By (Name)</label>
        <input type="text" name="handover_name">

        <label>Handed Over By (Contact)</label>
        <input type="text" name="handover_contact">

        <label>Photograph (Optional)</label>
        <input type="file" name="photo" accept="image/*">

        <button type="submit">Register Item</button>
    </form>
</div>
{% endblock %}
