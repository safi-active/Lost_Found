{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>{{ _("Register Recovered Item") }}</h2>
    <p style="margin-bottom: 1.5rem; color: var(--text-muted);">{{ _("Log an item handed over to security.") }}</p>
    <form method="POST" enctype="multipart/form-data">
        <label>{{ _("Item Name (Required)") }}</label>
        <input type="text" name="item_name" required>
        
        <label>{{ _("Color (Required)") }}</label>
        <input type="text" name="color" required>

        <label>{{ _("Date Received (Required)") }}</label>
        <input type="date" name="date_received" required>

        <label>{{ _("Location Found (Optional)") }}</label>
        <input type="text" name="location_found">

        <label>{{ _("Description (Optional)") }}</label>
        <textarea name="description" rows="2"></textarea>

        <label>{{ _("Handed Over By (Name)") }}</label>
        <input type="text" name="handover_name">

        <label>{{ _("Handed Over By (Contact)") }}</label>
        <input type="text" name="handover_contact">

        <label>{{ _("Photograph (Optional)") }}</label>
        <input type="file" name="photo" accept="image/*">

        <button type="submit">{{ _("Register Item") }}</button>
    </form>
</div>
{% endblock %}
